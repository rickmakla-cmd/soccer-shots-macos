name: SoccerShots

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    revision: 09deb8c4e9056fcd76b60718bb50325d1730572b
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.3.0

options:
  deploymentTarget:
    macOS: "15.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""

targets:
  SoccerShots:
    type: application
    platform: macOS
    sources:
      - path: Sources/SoccerShots
    dependencies:
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickmakla.SoccerShots
        PRODUCT_NAME: SoccerShots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SoccerShots
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        CODE_SIGN_ENTITLEMENTS: SoccerShots.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.14
        CURRENT_PROJECT_VERSION: 15
    entitlements:
      path: SoccerShots.entitlements

  SoccerShotsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SoccerShotsTests
    dependencies:
      - target: SoccerShots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickmakla.SoccerShotsTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SoccerShots:
    build:
      targets:
        SoccerShots: all
        SoccerShotsTests: [test]
    test:
      targets:
        - SoccerShotsTests
